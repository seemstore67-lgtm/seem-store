<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SEEM STORE | CPM Angola</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #080b10;
      color: white;
    }

    /* CABEÇALHO */
    header {
      background: linear-gradient(135deg, #111827, #05070a);
      padding: 35px 20px;
      text-align: center;
      border-bottom: 1px solid #242a35;
    }

    .logo {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 3px;
    }

    .subtitle {
      margin-top: 8px;
      color: #9ca3af;
      font-size: 15px;
    }

    /* BOTÃO WHATSAPP */
    .whatsapp-btn {
      display: inline-block;
      margin-top: 22px;
      padding: 14px 22px;
      background: #22c55e;
      color: #06130a;
      text-decoration: none;
      font-weight: bold;
      border-radius: 12px;
      transition: 0.2s;
    }

    .whatsapp-btn:hover {
      transform: scale(1.04);
    }

    /* CONTEÚDO */
    .container {
      max-width: 1100px;
      margin: auto;
      padding: 25px 15px;
    }

    .title {
      text-align: center;
      font-size: 27px;
      margin-bottom: 20px;
    }

    /* FILTROS */
    .filters {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    .filter {
      background: #151a22;
      border: 1px solid #303744;
      color: white;
      padding: 9px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
    }

    .filter.active {
      background: white;
      color: black;
    }

    /* CARROS */
    .cars {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 17px;
    }

    .car-card {
      background: #11151c;
      border: 1px solid #252c38;
      border-radius: 18px;
      padding: 20px;
      transition: 0.2s;
    }

    .car-card:hover {
      transform: translateY(-4px);
      border-color: #4b5563;
    }

    .car-name {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .category {
      display: inline-block;
      background: #202733;
      color: #cbd5e1;
      font-size: 12px;
      padding: 6px 9px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .price {
      font-size: 22px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .negociavel {
      color: #fbbf24;
      font-size: 12px;
      font-weight: bold;
    }
